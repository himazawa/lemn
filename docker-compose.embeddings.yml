services:
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    platform: linux/amd64
    environment:
      RUST_LOG: warn
      LOG_LEVEL: warn
    command:
      - --model-id
      - BAAI/bge-m3
      - --pooling
      - cls
      - --api-key
      - ${LEMN_BACKEND_API_KEY:?set LEMN_BACKEND_API_KEY}
      - --max-concurrent-requests
      - "4"
    ports:
      - "127.0.0.1:8001:80"
    volumes:
      - embeddingcache:/data
    restart: unless-stopped

volumes:
  embeddingcache: